<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b5a3b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Keldan" />
    <meta name="description" content="Keldan Properties Limited — Your Comfort, Our Priority. Tenants pay rent by MoMo or card, get receipts and report repairs; managers run properties, tenancies and rent." />
    <title>Keldan Properties Limited</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Safety net: if the app hasn't started after 9 s (old browser, broken saved copy), say so instead of a blank page. -->
    <script>
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.children.length) {
          root.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:420px;margin:15vh auto;padding:24px;text-align:center">' +
            '<h1 style="font-size:20px">The app didn\'t start</h1><p style="color:#555;font-size:14px">This can happen with an old saved copy or an outdated browser. Tap below to clear the saved copy and try again. If it still doesn\'t open, update Chrome / Safari.</p>' +
            '<button id="ew-fix" style="padding:12px 18px;border:0;border-radius:12px;background:#166534;color:#fff;font-weight:600">Clear &amp; reload</button></div>';
          document.getElementById('ew-fix').onclick = function () {
            var done = function () { location.replace(location.href.split('#')[0]); };
            try {
              Object.keys(localStorage).forEach(function (k) { if (/-(demo|live|pro)$/.test(k)) localStorage.removeItem(k); });
              var base = new URL('.', location.href).href;
              var jobs = [];
              if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.filter(function (r) { return r.scope === base; }).map(function (r) { return r.unregister(); })); }));
              if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf(base) >= 0; }).map(function (k) { return caches.delete(k); })); }));
              Promise.all(jobs).then(done, done);
            } catch (e) { done(); }
          };
        }
      }, 9000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
